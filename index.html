<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SudoinSTEM | Young Professionals Network</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #00b8f2;
        --green: #00924c;
        --red: #e22029;
        --yellow: #ffe61b;
        --dark: #111111;
        --white: #ffffff;
        --off: #f6f8f7;
        --muted: #555555;
        --border: #e2e2e2;
        --font: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--font);
        color: var(--dark);
        background: var(--white);
      }

      /* ── NAV ─────────────────────────────────────────────── */
      .nav {
        background: var(--white);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 200;
        padding: 0 40px;
      }
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 72px;
        gap: 24px;
      }
      .nav-logo {
        cursor: pointer;
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .nav-links {
        display: flex;
        gap: 4px;
      }
      .nav-link {
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: #333;
        padding: 8px 13px;
        border-radius: 4px;
        transition: color 0.15s;
      }
      .nav-link:hover {
        color: var(--green);
      }
      .nav-link.active {
        color: var(--green);
      }
      .nav-donate {
        background: var(--yellow);
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--dark);
        padding: 11px 24px;
        border-radius: 4px;
        transition: opacity 0.15s;
      }
      .nav-donate:hover {
        opacity: 0.85;
      }

      /* ── HERO ─────────────────────────────────────────────── */
      .hero {
        position: relative;
        min-height: 560px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
            circle at 20% 20%,
            rgba(0, 184, 242, 0.14),
            transparent 22%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(255, 230, 27, 0.08),
            transparent 24%
          ),
          linear-gradient(135deg, #003d20 0%, #001a0e 52%, #001229 100%);
        overflow: hidden;
        padding: 18px 24px 28px;
      }
      .hero-inner {
        position: relative;
        width: min(1200px, 100%);
        min-height: 500px;
      }
      .hero-bg-letters {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 60px;
        gap: 0;
        pointer-events: none;
      }
      .hero-bg-letter {
        font-size: 260px;
        font-weight: 800;
        line-height: 1;
        opacity: 0.04;
        letter-spacing: -12px;
      }
      .hero-network {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hero-network svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .network-line {
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 0.85;
        fill: none;
      }
      .hero-content {
        position: relative;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 500px;
        padding: 24px 20px 12px;
      }
      .hero-eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--blue);
        margin-bottom: 16px;
      }
      .hero-headline {
        font-size: clamp(38px, 5vw, 72px);
        font-weight: 800;
        line-height: 1.05;
        color: var(--white);
        margin-bottom: 24px;
        max-width: 760px;
      }
      .hero-headline span {
        color: var(--yellow);
      }
      .hero-sub {
        font-size: 17px;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.7;
        max-width: 760px;
        margin-bottom: 32px;
        font-weight: 400;
      }
      .hero-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(90px, 1fr));
        gap: 16px;
        width: min(680px, 100%);
        margin-bottom: 32px;
      }
      .hero-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(6px);
      }
      .hero-stat strong {
        color: var(--yellow);
        font-size: clamp(24px, 2vw, 36px);
        line-height: 1;
        font-weight: 800;
      }
      .hero-stat span {
        color: rgba(255, 255, 255, 0.8);
        font-size: 11px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        font-weight: 700;
      }
      .hero-actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn-yellow {
        background: var(--yellow);
        color: var(--dark);
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        padding: 15px 30px;
        border-radius: 4px;
        transition: opacity 0.15s;
      }
      .btn-yellow:hover {
        opacity: 0.88;
      }
      .btn-ghost {
        background: transparent;
        color: var(--white);
        border: 2px solid rgba(255, 255, 255, 0.4);
        cursor: pointer;
        font-family: var(--font);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        padding: 13px 26px;
        border-radius: 4px;
        transition: border-color 0.15s;
      }
      .btn-ghost:hover {
        border-color: rgba(255, 255, 255, 0.9);
      }
      .member-card {
        position: absolute;
        width: 148px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(8px);
        box-shadow: 0 16px 32px rgba(4, 11, 18, 0.18);
        animation: floatCard 7s ease-in-out infinite;
        opacity: 0;
        animation-fill-mode: both;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        z-index: 1;
      }
      .member-card.featured {
        width: 168px;
        padding: 12px 14px;
      }
      .member-card.featured .member-avatar {
        width: 48px;
        height: 48px;
      }
      .member-card.compact {
        width: 128px;
        padding: 8px 10px;
      }
      .member-card.compact .member-avatar {
        width: 36px;
        height: 36px;
      }
      .member-card.compact .member-name {
        font-size: 10px;
      }
      .member-card.compact .member-role {
        font-size: 9px;
      }
      .member-card:hover {
        transform: translateY(-6px) scale(1.03);
        box-shadow: 0 20px 36px rgba(4, 11, 18, 0.24);
      }
      .member-card:nth-child(odd) {
        animation-delay: 0.2s;
      }
      .member-card:nth-child(3n) {
        animation-delay: 0.5s;
      }
      .member-card:nth-child(4n) {
        animation-delay: 0.8s;
      }
      .member-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.8);
        flex-shrink: 0;
      }
      .member-meta {
        min-width: 0;
      }
      .member-name {
        display: block;
        color: var(--white);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .member-role {
        display: block;
        color: rgba(255, 255, 255, 0.72);
        font-size: 10px;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .member-card.card-1 {
        left: 0.5%;
        top: 4%;
        animation-delay: 0.05s;
      }
      .member-card.card-2 {
        left: 1%;
        top: 70%;
        animation-delay: 0.25s;
      }
      .member-card.card-3 {
        left: 12%;
        top: 2%;
        animation-delay: 0.45s;
      }
      .member-card.card-4 {
        right: 1%;
        top: 4%;
        animation-delay: 0.65s;
      }
      .member-card.card-5 {
        right: 0.5%;
        top: 68%;
        animation-delay: 0.85s;
      }
      .member-card.card-6 {
        right: 2%;
        bottom: 2%;
        animation-delay: 1.05s;
      }
      .member-card.card-7 {
        left: 14%;
        bottom: 2%;
        animation-delay: 1.2s;
      }
      .member-card.card-8 {
        left: 2%;
        bottom: 4%;
        animation-delay: 1.4s;
      }
      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0px);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        50% {
          transform: translateY(-8px);
        }
        100% {
          transform: translateY(0px);
          opacity: 1;
        }
      }
      @media (max-width: 900px) {
        .hero {
          min-height: 700px;
        }
        .member-card {
          width: 132px;
        }
        .member-card.featured {
          width: 148px;
        }
        .member-card.compact {
          width: 116px;
        }
      }
      /* ── LIGHT THEME HERO ───────────────────────────────── */
      .hero.hero-light {
        background: linear-gradient(
          135deg,
          #f9faf9 0%,
          #f3f8f6 50%,
          #ecf4f1 100%
        );
      }
      .hero.hero-light .hero-headline {
        color: var(--dark);
      }
      .hero.hero-light .hero-headline span {
        color: var(--green);
      }
      .hero.hero-light .hero-eyebrow {
        color: var(--green);
      }
      .hero.hero-light .hero-sub {
        color: #555;
      }
      .hero.hero-light .member-card {
        background: rgba(0, 148, 76, 0.08);
        border: 1px solid rgba(0, 148, 76, 0.18);
      }
      .hero.hero-light .member-name {
        color: var(--dark);
      }
      .hero.hero-light .member-role {
        color: #777;
      }
      .hero.hero-light .hero-stat {
        background: rgba(0, 148, 76, 0.06);
        border: 1px solid rgba(0, 148, 76, 0.14);
      }
      .hero.hero-light .hero-stat strong {
        color: var(--green);
      }
      .hero.hero-light .hero-stat span {
        color: #666;
      }
      .hero.hero-light .btn-ghost {
        color: var(--dark);
        border: 2px solid rgba(0, 148, 76, 0.3);
      }
      .hero.hero-light .btn-ghost:hover {
        border-color: rgba(0, 148, 76, 0.8);
      }
      .hero.hero-light .network-line {
        stroke: rgba(0, 148, 76, 0.1);
      }
      .hero.hero-light .hero-bg-letter {
        opacity: 0.03;
      }

      @media (max-width: 700px) {
        .hero {
          padding: 36px 18px;
          min-height: 760px;
        }
        .hero-content {
          min-height: 500px;
          padding-top: 80px;
        }
        .hero-sub {
          font-size: 15px;
        }
        .hero-stats {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
          width: min(420px, 100%);
        }
        .member-card {
          width: 110px;
        }
        .member-card.featured {
          width: 130px;
        }
        .member-card.compact {
          display: none;
        }
        .member-card.card-1 {
          left: 1%;
          top: 8%;
        }
        .member-card.card-2 {
          left: 1%;
          top: 68%;
        }
        .member-card.card-4 {
          right: 2%;
          top: 8%;
        }
        .member-card.card-6 {
          right: 1%;
          bottom: 4%;
        }
        .member-card.card-8 {
          left: 2%;
          bottom: 6%;
        }
      }

      /* ── GENERAL SECTIONS ────────────────────────────────── */
      .section {
        padding: 80px 60px;
      }
      .section-white {
        background: var(--white);
      }
      .section-off {
        background: var(--off);
      }
      .section-dark {
        background: var(--dark);
      }
      .section-green {
        background: var(--green);
      }

      .section-inner {
        max-width: 1100px;
        margin: 0 auto;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 10px;
      }
      .eyebrow-blue {
        color: var(--blue);
      }
      .eyebrow-red {
        color: var(--red);
      }
      .section-heading {
        font-size: clamp(26px, 3.5vw, 38px);
        font-weight: 800;
        line-height: 1.15;
        margin-bottom: 14px;
      }
      .section-sub {
        font-size: 16px;
        color: var(--muted);
        line-height: 1.7;
        max-width: 600px;
        margin-bottom: 48px;
      }

      /* ── CARDS ───────────────────────────────────────────── */
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 22px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 22px;
      }

      .card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 28px;
      }
      .card-top-bar {
        height: 4px;
        border-radius: 2px;
        margin-bottom: 22px;
      }
      .card-title {
        font-size: 17px;
        font-weight: 800;
        margin-bottom: 10px;
      }
      .card-text {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.7;
      }
      .card-list {
        margin-top: 12px;
        padding-left: 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }
      .card-list li + li {
        margin-top: 6px;
      }

      /* pill */
      .pill {
        display: inline-block;
        padding: 3px 11px;
        border-radius: 99px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .pill-green {
        background: #e6f4ed;
        color: var(--green);
      }
      .pill-blue {
        background: #e0f6ff;
        color: #007db5;
      }
      .pill-red {
        background: #fde8e8;
        color: #b51a20;
      }
      .pill-grey {
        background: #f0f0f0;
        color: #666;
      }

      /* ── INITIATIVE ROWS ─────────────────────────────────── */
      .initiative-row {
        background: var(--white);
        border: 1px solid var(--border);
        border-left: 5px solid;
        border-radius: 6px;
        padding: 28px 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .initiative-info {
        flex: 1;
        min-width: 240px;
      }
      .initiative-title {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .initiative-meta {
        font-size: 13px;
        color: #888;
        margin-bottom: 10px;
      }
      .initiative-desc {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.65;
      }

      /* ── STATS BAR ───────────────────────────────────────── */
      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0;
        background: var(--green);
      }
      .stat-item {
        padding: 36px 32px;
        border-right: 1px solid rgba(255, 255, 255, 0.15);
        text-align: center;
      }
      .stat-item:last-child {
        border-right: none;
      }
      .stat-number {
        font-size: 42px;
        font-weight: 800;
        color: var(--yellow);
        line-height: 1;
      }
      .stat-label {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 6px;
        font-weight: 500;
      }

      /* ── GLOBAL COMMUNITY ───────────────────────────────── */
      .community-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin: 14px 0 28px;
      }
      .community-stat {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 24px 18px;
        text-align: center;
      }
      .community-stat-number {
        font-size: clamp(26px, 2vw, 38px);
        font-weight: 800;
        color: var(--green);
        line-height: 1;
      }
      .community-stat-label {
        font-size: 13px;
        color: var(--muted);
        margin-top: 10px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .community-map-wrap {
        background: var(--off);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 18px 22px;
      }
      .map-shell {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 220px;
        max-height: 360px;
        background: linear-gradient(180deg, #f8faf9 0%, #eef4f2 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .world-map-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: saturate(0.9) contrast(1.12);
      }
      .map-marker {
        position: absolute;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--marker-color, var(--green));
        border: 2px solid rgba(255, 255, 255, 0.96);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.8),
          0 6px 18px rgba(17, 24, 39, 0.12);
        transition: transform 0.25s ease, box-shadow 0.25s ease,
          filter 0.25s ease;
        transform-origin: center;
        will-change: transform;
      }
      .map-marker:hover {
        transform: translateY(-3px) scale(1.12);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.9),
          0 10px 22px rgba(0, 148, 76, 0.22), 0 0 18px rgba(0, 148, 76, 0.18);
        filter: drop-shadow(0 0 10px rgba(0, 148, 76, 0.22));
      }

      /* ── DONATE CARDS ────────────────────────────────────── */
      .donate-card {
        background: var(--white);
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
      }
      .donate-card-title {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 10px;
      }
      .donate-card-desc {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.65;
        margin-bottom: 28px;
      }
      .btn-paypal {
        background: #0070ba;
        color: #fff;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 15px;
        font-weight: 700;
        padding: 14px 32px;
        border-radius: 4px;
        transition: opacity 0.15s;
      }
      .btn-paypal:hover {
        opacity: 0.88;
      }
      .btn-cashapp {
        background: #00d632;
        color: #1a1a1a;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 15px;
        font-weight: 700;
        padding: 14px 32px;
        border-radius: 4px;
        transition: opacity 0.15s;
      }
      .btn-cashapp:hover {
        opacity: 0.88;
      }

      /* ── FORM ────────────────────────────────────────────── */
      .form-wrap {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 44px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 7px;
        color: #222;
      }
      .form-input {
        width: 100%;
        padding: 12px 15px;
        border: 1.5px solid var(--border);
        border-radius: 5px;
        font-family: var(--font);
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
        color: var(--dark);
      }
      .form-input:focus {
        border-color: var(--green);
      }
      .btn-green {
        background: var(--green);
        color: var(--white);
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 15px 36px;
        border-radius: 4px;
        transition: opacity 0.15s;
      }
      .btn-green:hover {
        opacity: 0.88;
      }

      /* ── FAQ ─────────────────────────────────────────────── */

        justify-content: space-between;

        background: none;
        border: none;
        padding: 24px 0;
        text-align: left;
        font-family: var(--font);
        cursor: pointer;

        font-weight: 700;
        color: var(--dark);

        height: 28px;
        border-radius: 50%;
        color: var(--green);

        line-height: 1;
        font-weight: 700;
        transition: transform 0.25s ease;
        transform-origin: center;
        flex-shrink: 0;
      }
      .faq-accordion-item.is-open .faq-icon {
        transform: rotate(90deg);
      }
      .faq-answer {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height 0.35s ease, opacity 0.25s ease;
      }
      .faq-accordion-item.is-open .faq-answer {
        opacity: 1;
      }

        font-size: 14px;
        color: var(--muted);

        padding: 0 0 24px;
      }

      function bindFaqAccordion() {
        document.querySelectorAll(".faq-accordion-item").forEach((item) => {
          const button = item.querySelector(".faq-question");
          const answer = item.querySelector(".faq-answer");

          if (!button || !answer) return;

          const syncState = (isOpen) => {
            item.classList.toggle("is-open", isOpen);
            button.setAttribute("aria-expanded", String(isOpen));
            answer.style.maxHeight = isOpen
              ? `${answer.scrollHeight}px`
              : "0px";
          };

          syncState(false);

          button.addEventListener("click", () => {
            const isOpen = item.classList.contains("is-open");
            syncState(!isOpen);
          });
        });
      }

      function bindStoryCarousel() {
        const slider = document.querySelector(".story-slider");
        const track = document.querySelector(".story-track");
        const prev = document.querySelector(".story-prev");
        const next = document.querySelector(".story-next");

        if (!slider || !track || !prev || !next) return;

        const cards = Array.from(track.children);
        let currentIndex = 0;

        const updateSlider = () => {
          const offset = currentIndex * 100;
          track.style.transform = `translateX(-${offset}%)`;
          prev.disabled = currentIndex === 0;
          next.disabled = currentIndex === cards.length - 1;
        };

        prev.addEventListener("click", () => {
          if (currentIndex > 0) {
            currentIndex -= 1;
            updateSlider();
          }
        });

        next.addEventListener("click", () => {
          if (currentIndex < cards.length - 1) {
            currentIndex += 1;
            updateSlider();
          }
        });

        let startX = 0;
        let isDragging = false;

        slider.addEventListener(
          "touchstart",
          (event) => {
            startX = event.touches[0].clientX;
            isDragging = true;
          },
          { passive: true }
        );

        slider.addEventListener(
          "touchmove",
          (event) => {
            if (!isDragging) return;
            const diff = event.touches[0].clientX - startX;
            if (Math.abs(diff) > 40) {
              if (diff < 0 && currentIndex < cards.length - 1) {
                currentIndex += 1;
              } else if (diff > 0 && currentIndex > 0) {
                currentIndex -= 1;
              }
              updateSlider();
              isDragging = false;
            }
          },
          { passive: true }
        );

        slider.addEventListener("touchend", () => {
          isDragging = false;
        });

        updateSlider();
      }

      // ─── ROUTING ──────────────────────────────────────────────────────────────────
      function navigate(pageId) {
        document.getElementById("main").innerHTML = pages[pageId]();
        document.querySelectorAll(".nav-link").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.page === pageId);
        });
        bindFaqAccordion();
        bindStoryCarousel();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Init
      navigate("home");
